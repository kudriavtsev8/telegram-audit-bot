[project]
name = "telegram-communication-audit-bot"
version = "0.1.0"
description = "Daily communication audit bot for Telegram agency chats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.36.0",
  "openai>=1.30.0",
  "python-dotenv>=1.0.1",
  "APScheduler>=3.10.4",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
